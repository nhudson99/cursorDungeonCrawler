name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prefer GitHub Actions as Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "Pages build_type=$bt"
          if [ "$bt" = "workflow" ]; then
            exit 0
          fi
          echo "Pages source is '$bt' (Deploy from a branch), not GitHub Actions."
          if gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
            echo "Switched Pages source to GitHub Actions (workflow)."
          else
            echo "::warning::GITHUB_TOKEN cannot change Settings → Pages → Source. Leave it on GitHub Actions. Deploy from a branch (main /) publishes the Vite source index.html (/src/main.ts) and overwrites dist/."
          fi
      - name: Cancel competing branch Pages Jekyll deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cancel-pages-jekyll.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build web client
        run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Verify Pages bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -F "/${{ github.event.repository.name }}/assets/" dist/index.html
          if grep -F 'src="/src/main.ts"' dist/index.html; then
            echo "::error::dist/index.html still points at /src/main.ts (Vite source). Pages must publish dist/, not the repo root."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel competing branch Pages Jekyll deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cancel-pages-jekyll.sh
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep dist in front of branch Jekyll
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/cancel-pages-jekyll.sh
